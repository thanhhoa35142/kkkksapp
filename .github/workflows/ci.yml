name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build iOS/iPadOS (compile check, no signing)
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Native macOS destination of the same target (not Catalyst).
      - name: Build macOS (compile check, no signing)
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Unit + UI tests on the first available iPhone simulator of the
      # selected Xcode (device names change between Xcode releases).
      - name: Test iOS (unit + UI tests on a simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination "id=$UDID" \
            -configuration Debug \
            -resultBundlePath build/ios.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      # Failure screenshots XCTest takes automatically, for review without a Mac.
      - name: Export iOS failure screenshots
        if: ${{ failure() && hashFiles('build/ios.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/ios-screenshots
          xcrun xcresulttool export attachments \
            --path build/ios.xcresult --output-path build/ios-screenshots --only-failures
          python3 scripts/rename-screenshots.py build/ios-screenshots \
            || echo "rename failed: keeping the exported file names"

      - name: Upload iOS failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-screenshots
          path: build/ios-screenshots
          if-no-files-found: ignore
          retention-days: 14

      # Native Mac app on fixture data (no backend): captures the main screens
      # for review without a Mac. Signing overrides: ci/mac-screenshots.xcconfig.
      - name: Test macOS (screenshots)
        if: ${{ !cancelled() }}
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination 'platform=macOS' \
            -configuration Debug \
            -only-testing:MyAppUITests/MacScreenshotTests \
            -resultBundlePath build/mac.xcresult \
            -xcconfig ci/mac-screenshots.xcconfig \
            test

      - name: Export macOS screenshots
        if: ${{ !cancelled() && hashFiles('build/mac.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/mac-screenshots
          xcrun xcresulttool export attachments \
            --path build/mac.xcresult --output-path build/mac-screenshots
          python3 scripts/rename-screenshots.py build/mac-screenshots \
            || echo "rename failed: keeping the exported file names"

      - name: Upload macOS screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: build/mac-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      # Runs after the tests (always), so a missing translation never hides
      # test results. Every string Xcode extracts from the code must be translated for
      # the shipped languages (catches new or reworded strings).
      - name: Check translations (nl, de, es)
        if: always()
        run: |
          xcodebuild -exportLocalizations \
            -project MyApp.xcodeproj \
            -localizationPath build/loc \
            -exportLanguage nl -exportLanguage de -exportLanguage es \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          python3 scripts/check-translations.py build/loc
