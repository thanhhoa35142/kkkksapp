name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on the same branch / PR cancels the run still going for the
# previous one: only the latest commit's result matters, and macOS minutes
# are expensive (x10 on a private repo).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Four jobs in parallel, so a slow one never holds the others back:
#   ios (a)       ~15 min  half of the UI tests on a simulator
#   ios (b)       ~15 min  the other half (and any test added later)
#   macos         ~5 min   native Mac app: build + screenshots
#   translations  ~3 min   every string translated (nl, de, es) + color contrast
# `xcodebuild test` builds the app itself, so there is no separate build step.

jobs:
  ios:
    name: ios (${{ matrix.group }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Split by measured run time (~15 min of tests each; a carries the
          # ~40 iPhone screenshots). Group b skips
          # group a's tests and runs everything else, so a new test is never
          # left out.
          - group: a
            select: >-
              -only-testing:MyAppUITests/LayoutTests/testOnboardingPrimaryButtonsAtTheBottom
              -only-testing:MyAppUITests/LayoutTests/testBestNowAtNight
              -only-testing:MyAppUITests/LayoutTests/testTabBarInThumbZone
              -only-testing:MyAppUITests/MyAppUITests
              -only-testing:MyAppUITests/PhoneScreenshotTests
          - group: b
            select: >-
              -skip-testing:MyAppUITests/LayoutTests/testOnboardingPrimaryButtonsAtTheBottom
              -skip-testing:MyAppUITests/LayoutTests/testBestNowAtNight
              -skip-testing:MyAppUITests/LayoutTests/testTabBarInThumbZone
              -skip-testing:MyAppUITests/MyAppUITests
              -skip-testing:MyAppUITests/MacScreenshotTests
              -skip-testing:MyAppUITests/PhoneScreenshotTests
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      # The first available iPhone simulator of the selected Xcode (device
      # names change between Xcode releases).
      - name: Test iOS
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination "id=$UDID" \
            -configuration Debug \
            -resultBundlePath build/ios.xcresult \
            ${{ matrix.select }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      # Group a: the iPhone screens (PhoneScreenshotTests, named "NN-...").
      - name: Export screenshots
        if: ${{ !cancelled() && matrix.group == 'a' && hashFiles('build/ios.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/ios-all
          xcrun xcresulttool export attachments \
            --path build/ios.xcresult --output-path build/ios-all
          python3 scripts/rename-screenshots.py build/ios-all \
            || echo "rename failed: keeping the exported file names"

      - name: Upload screenshots
        if: ${{ !cancelled() && matrix.group == 'a' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/ios-all/[0-9][0-9]-*.png
          if-no-files-found: warn
          retention-days: 14

      # A screenshot per failure (LayoutTests.record), for review without a Mac.
      - name: Export failure screenshots
        if: ${{ failure() && hashFiles('build/ios.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/ios-screenshots
          xcrun xcresulttool export attachments \
            --path build/ios.xcresult --output-path build/ios-screenshots --only-failures
          python3 scripts/rename-screenshots.py build/ios-screenshots \
            || echo "rename failed: keeping the exported file names"

      - name: Upload failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-screenshots-${{ matrix.group }}
          path: build/ios-screenshots
          if-no-files-found: ignore
          retention-days: 14

  # Native Mac app (same target, not Catalyst) on fixture data, no backend.
  # Building it for the tests is the macOS compile check. Signing overrides:
  # ci/mac-screenshots.xcconfig.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test macOS (screenshots)
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination 'platform=macOS' \
            -configuration Debug \
            -only-testing:MyAppUITests/MacScreenshotTests \
            -resultBundlePath build/mac.xcresult \
            -xcconfig ci/mac-screenshots.xcconfig \
            test

      - name: Export screenshots
        if: ${{ !cancelled() && hashFiles('build/mac.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/mac-screenshots
          xcrun xcresulttool export attachments \
            --path build/mac.xcresult --output-path build/mac-screenshots
          python3 scripts/rename-screenshots.py build/mac-screenshots \
            || echo "rename failed: keeping the exported file names"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: build/mac-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  # Every string Xcode extracts from the code must be translated for the
  # shipped languages (catches new or reworded strings).
  translations:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Check translations (nl, de, es)
        run: |
          xcodebuild -exportLocalizations \
            -project MyApp.xcodeproj \
            -localizationPath build/loc \
            -exportLanguage nl -exportLanguage de -exportLanguage es \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          python3 scripts/check-translations.py build/loc

      # The app's own colors against every background they are drawn on
      # (WCAG AA 4.5:1). Replaces the UI-test audit's contrast check.
      - name: Check color contrast
        if: ${{ !cancelled() }}
        run: python3 scripts/check-contrast.py
